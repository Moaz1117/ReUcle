name: ReUcle CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-and-sonar:
    name: Unit Tests, Coverage & SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Run JUnit Tests & JaCoCo (bin-service & user-service)
        run: |
          mvn -B -f services/bin-service/pom.xml clean test jacoco:report
          mvn -B -f services/user-service/pom.xml clean test jacoco:report

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: services/*/target/site/jacoco/

      - name: SonarQube Scan & Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=moaz1117
            -Dsonar.projectKey=Moaz1117_ReUcle
            -Dsonar.sources=services/bin-service/src/main,services/user-service/src/main
            -Dsonar.tests=services/bin-service/src/test,services/user-service/src/test
            -Dsonar.java.binaries=services/bin-service/target/classes,services/user-service/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=services/bin-service/target/site/jacoco/jacoco.xml,services/user-service/target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true

  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-sonar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - bin-service
          - collection-service
          - fleet-service
          - material-service
          - inventory-service
          - reward-service
          - payment-service
          - shop-service
          - marketplace-service
          - analytics-service
          - notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ghcr.io/moaz1117/reucle-${{ matrix.service }}:sha-${{ github.sha }}
