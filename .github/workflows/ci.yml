name: ReUcle CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

jobs:
  test-all-services:
    name: Unit Tests & Coverage (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - bin-service
          - collection-service
          - fleet-service
          - material-service
          - inventory-service
          - reward-service
          - payment-service
          - shop-service
          - marketplace-service
          - analytics-service
          - notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: services/*/pom.xml

      - name: Run JUnit Tests & JaCoCo for ${{ matrix.service }}
        run: |
          POM_PATH="services/${{ matrix.service }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            mvn -f "$POM_PATH" clean test jacoco:report -DfailIfNoTests=false
          else
            echo "No pom.xml found for ${{ matrix.service }}, skipping Maven test."
          fi

      - name: Upload JaCoCo Report (${{ matrix.service }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore

  sonar-analysis:
    name: SonarQube Scan & Quality Gate
    needs: test-all-services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: services/*/pom.xml

      - name: Run Tests & JaCoCo for Sonar-Scanned Services
        run: |
          mvn -f services/bin-service/pom.xml clean test jacoco:report -DfailIfNoTests=false
          mvn -f services/user-service/pom.xml clean test jacoco:report -DfailIfNoTests=false

      - name: SonarQube Scan & Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -f services/bin-service/pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Moaz1117_ReUcle_bin-service \
            -Dsonar.organization=moaz1117 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
          mvn -f services/user-service/pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Moaz1117_ReUcle_user-service \
            -Dsonar.organization=moaz1117 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  build-and-push:
    name: Build & Push Docker Images
    needs: [ test-all-services, sonar-analysis ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - bin-service
          - collection-service
          - fleet-service
          - material-service
          - inventory-service
          - reward-service
          - payment-service
          - shop-service
          - marketplace-service
          - analytics-service
          - notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/moaz1117/reucle-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/moaz1117/reucle-${{ matrix.service }}:${{ github.ref_name }}
